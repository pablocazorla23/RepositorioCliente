<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login con Promesas</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


    <div class="container mt-5" style="max-width: 400px;">
        <h3 class="text-center mb-4">Iniciar sesión</h3>


        <!-- Alertas -->
        <div id="alerta"></div>


        <!-- Formulario de Login -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="test@medac.es">
            </div>


            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="1234">
            </div>


            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
        </form>


        <!-- Credenciales de prueba -->
        <div class="card mt-4">
            <div class="card-body">
                <h6 class="card-title">Credenciales válidas de prueba:</h6>
                <p class="mb-1"><strong>Email:</strong> <span class="text-danger">test@medac.es</span></p>
                <p class="mb-0"><strong>Password:</strong> <span class="text-danger">1234</span></p>
            </div>
        </div>


        <!-- Spinner -->
        <div id="spinner" class="text-center mt-3 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Validando credenciales...</p>
        </div>
    </div>


    <script>
        const form = document.getElementById('loginForm');
        const alerta = document.getElementById('alerta');
        const spinner = document.getElementById('spinner');


        form.addEventListener('submit', function (e) {
            e.preventDefault();


            alerta.innerHTML = '';


            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();


            // Validación básica
            if (email === '' || password === '') {
                alerta.innerHTML = '<div class="alert alert-danger">Todos los campos son obligatorios</div>';
                return;
            }


            spinner.classList.remove('d-none');


            login(email, password)
                .then(respuesta => {
                    alerta.innerHTML = `<div class="alert alert-success">${respuesta}</div>`;
                })
                .catch(error => {
                    alerta.innerHTML = `<div class="alert alert-danger">${error}</div>`;
                })
                .finally(() => {
                    spinner.classList.add('d-none');
                });
             });


        // Función login con Promesa
        function login(email, password) {
            return new Promise((resolve, reject) => {
                const tiempo = Math.random() * 1000 + 1000; // entre 1 y 2 segundos


                setTimeout(() => {
                    if (email === 'test@medac.es' && password === '1234') {
                        resolve('Login correcto. Bienvenido.');
                    } else {
                        reject('Credenciales incorrectas.');
                    }
                }, tiempo);
            });
        }
    </script>


</body>

</html>
