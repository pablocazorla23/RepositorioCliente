<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica: Eventos, RegEx y Cookies</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .mensaje {
            font-size: 14px;
            color: #666;
        }
        .correcto {
            color: green;
        }
        .incorrecto {
            color: red;
        }
        /* mantiene un espaciado consistente para inputs nativos si se necesita */
        input {
            display: block;
            margin-bottom: 10px;
            padding: 5px;
        }
    </style>
</head>
<body>
<div class="container my-4">
    <h2 id="saludo" class="mb-4"></h2>

    <form id="formulario" class="row g-3">
        <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre de usuario</label>
            <input type="text" id="nombre" class="form-control" onfocus="mostrarAyuda('nombre')" onblur="ocultarAyuda('nombre')" oninput="validarCampo('nombre')">
            <p id="ayuda-nombre" class="mensaje form-text"></p>
            <p id="estado-nombre" class="mensaje"></p>
        </div>

        <div class="col-md-6">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="text" id="email" class="form-control" onfocus="mostrarAyuda('email')" onblur="ocultarAyuda('email')" oninput="validarCampo('email')">
            <p id="ayuda-email" class="mensaje form-text"></p>
            <p id="estado-email" class="mensaje"></p>
        </div>

        <div class="col-md-6">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" onfocus="mostrarAyuda('password')" onblur="ocultarAyuda('password')" oninput="validarCampo('password')">
            <p id="ayuda-password" class="mensaje form-text"></p>
            <p id="estado-password" class="mensaje"></p>
        </div>

        <div class="col-md-6">
            <label for="edad" class="form-label">Edad</label>
            <input type="text" id="edad" class="form-control" onfocus="mostrarAyuda('edad')" onblur="ocultarAyuda('edad')" oninput="validarCampo('edad')">
            <p id="ayuda-edad" class="mensaje form-text"></p>
            <p id="estado-edad" class="mensaje"></p>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Enviar</button>
            <button type="button" id="btnEliminarCookie" class="btn btn-danger ms-2">Eliminar cookie</button>
        </div>
    </form>
</div>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>
</body>
</html>
